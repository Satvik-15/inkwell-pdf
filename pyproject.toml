[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localpdf"
version = "0.1.0"
description = "Edit the text in any PDF, in its own font, on your own computer."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "pywebview>=5.0",
  "fonttools>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
localpdf = "localpdf.desktop:main"

[tool.setuptools]
packages = ["localpdf"]

[tool.setuptools.package-data]
localpdf = ["web/*", "web/icons/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
