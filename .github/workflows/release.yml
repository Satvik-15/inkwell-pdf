name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub release.
# Run it by hand from the Actions tab ("Run workflow") to test the builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf fonttools pytest && pytest -q

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]   # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: InkwellPDF-macOS-${{ matrix.runner }}
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: ./scripts/build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: InkwellPDF-Windows
          path: dist/*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
