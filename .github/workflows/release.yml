name: Release

# Push a tag like v0.1.0 to build the Mac app and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf fonttools pytest && pytest -q
      - run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-macOS
          path: dist/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
